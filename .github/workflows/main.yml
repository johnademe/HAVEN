
name: Deploy Haven

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Haven with backup and rollback
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            APP_DIR="/home/haven"
            BACKUP_DIR="/home/haven-backups"
            SERVICE="haven"
            REPO="https://github.com/johnademe/HAVEN.git"

            TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
            BACKUP="$BACKUP_DIR/$TIMESTAMP"

            echo "======================================"
            echo "HAVEN DEPLOYMENT"
            echo "======================================"

            mkdir -p "$BACKUP_DIR"

            # ----------------------------------------
            # 1. Backup current deployment
            # ----------------------------------------

            if [ -d "$APP_DIR/.git" ]; then
                echo "Creating backup: $BACKUP"

                mkdir -p "$BACKUP"

                rsync -a \
                  --exclude=".git" \
                  "$APP_DIR/" \
                  "$BACKUP/"

                cd "$APP_DIR"

                git rev-parse HEAD > "$BACKUP/DEPLOYED_COMMIT"

                echo "Backup created successfully."
            else
                echo "No existing Git deployment found."
                echo "This is the first deployment."
            fi

            # ----------------------------------------
            # 2. Clone or update repository
            # ----------------------------------------

            if [ ! -d "$APP_DIR/.git" ]; then

                echo "Cloning Haven repository..."

                rm -rf "$APP_DIR"
                mkdir -p "$APP_DIR"

                git clone "$REPO" "$APP_DIR"

            else

                echo "Updating Haven repository..."

                cd "$APP_DIR"

                git fetch origin
                git reset --hard origin/main
                git clean -fd

            fi

            cd "$APP_DIR"

            echo "Deployed commit:"
            git rev-parse --short HEAD

            # ----------------------------------------
            # 3. Install Python dependencies
            # ----------------------------------------

            if [ -f "$APP_DIR/requirements.txt" ]; then
                echo "Installing Python dependencies..."

                python3 -m pip install -r requirements.txt
            else
                echo "No requirements.txt found."
            fi

            # ----------------------------------------
            # 4. Reload systemd
            # ----------------------------------------

            echo "Reloading systemd..."

            systemctl daemon-reload

            # ----------------------------------------
            # 5. Restart Haven
            # ----------------------------------------

            echo "Restarting $SERVICE..."

            systemctl restart "$SERVICE"

            sleep 5

            # ----------------------------------------
            # 6. Verify service
            # ----------------------------------------

            if systemctl is-active --quiet "$SERVICE"; then

                echo "======================================"
                echo "DEPLOYMENT SUCCESSFUL"
                echo "======================================"

                systemctl --no-pager status "$SERVICE"

            else

                echo "======================================"
                echo "DEPLOYMENT FAILED"
                echo "Starting rollback..."
                echo "======================================"

                # ----------------------------------------
                # 7. Rollback
                # ----------------------------------------

                if [ -f "$BACKUP/DEPLOYED_COMMIT" ]; then

                    echo "Restoring previous deployment..."

                    find "$APP_DIR" -mindepth 1 -maxdepth 1 \
                      -exec rm -rf {} +

                    rsync -a "$BACKUP/" "$APP_DIR/"

                    rm -f "$APP_DIR/DEPLOYED_COMMIT"

                    systemctl daemon-reload
                    systemctl restart "$SERVICE"

                    sleep 5

                    if systemctl is-active --quiet "$SERVICE"; then
                        echo "Rollback successful."
                    else
                        echo "Rollback FAILED."

                        systemctl --no-pager status "$SERVICE"

                        exit 1
                    fi

                else
                    echo "No previous backup available."
                    exit 1
                fi
            fi

            # ----------------------------------------
            # 8. Keep latest 5 backups
            # ----------------------------------------

            echo "Cleaning old backups..."

            cd "$BACKUP_DIR"

            ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf

            echo "Remaining backups:"
            ls -lah "$BACKUP_DIR"

            echo "======================================"
            echo "HAVEN DEPLOYMENT COMPLETE"
            echo "======================================"

